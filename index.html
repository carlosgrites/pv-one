<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PV One - Portal Pista Verde</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">
  <nav class="bg-black p-4 border-b border-green-500 flex justify-between items-center">
    <h1 class="text-xl font-bold text-green-400">PV ONE <span class="text-xs text-gray-400">v1.0</span></h1>
    <span class="text-sm bg-green-900 text-green-300 px-3 py-1 rounded-full">Online</span>
  </nav>

  <main class="p-6 max-w-4xl mx-auto">
    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 shadow-xl">
      <h2 class="text-2xl font-bold mb-4 border-b border-gray-700 pb-2">Módulo 1: Redação & Editorial</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">Título da Matéria (SEO Nativo)</label>
          <input type="text" placeholder="Ex: GP de Kart - Etapa Final" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white focus:outline-none focus:border-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Conteúdo da Matéria (HTML Direto Wix Blog)</label>
          <textarea rows="5" placeholder="Escreva o texto aqui..." class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white focus:outline-none focus:border-green-500"></textarea>
        </div>

        <div class="flex justify-end gap-3">
          <button class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded">Salvar Rascunho</button>
          <button class="bg-green-600 hover:bg-green-500 text-white font-bold px-4 py-2 rounded">Enviar para Fila</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
