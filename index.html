<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PV ONE v3.0 - Central Editorial Portal Pista Verde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #080c14; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    
    .ppv-materia { font-family: "Poppins", "Inter", sans-serif; color: #21300c; background: #ffffff; line-height: 1.75; border-radius: 12px; overflow: hidden; }
    .ppv-hero { min-height: 420px; display: flex; align-items: flex-end; padding: 36px 24px; position: relative; background-size: cover; background-position: center; }
    .ppv-hero-content { position: relative; z-index: 2; width: 100%; max-width: 920px; margin: 0 auto; }
    .ppv-label { display: inline-block; margin-bottom: 12px; padding: 6px 14px; border-radius: 999px; background: #00ae35; color: #ffffff; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .ppv-hero-title { margin: 0 0 12px; color: #ffffff; font-size: clamp(24px, 3.5vw, 42px); font-weight: 900; line-height: 1.1; text-transform: uppercase; font-family: "Anton", sans-serif; }
    .ppv-underline { width: 70px; height: 4px; margin: 0 0 14px; border-radius: 999px; background: #00ae35; }
    .ppv-subtitle { margin: 0; color: #f3f3f3; font-size: clamp(14px, 1.5vw, 18px); font-weight: 500; line-height: 1.45; }
    .ppv-container { max-width: 860px; margin: 0 auto; padding: 30px 20px 50px; }
    
    .ppv-ad { margin: 34px 0; border: 1px solid rgba(0,174,53,.35); border-radius: 16px; background: #101510; color: #ffffff; overflow: hidden; }
    .ppv-ad-inner { display: grid; grid-template-columns: 140px 1fr; gap: 18px; align-items: center; padding: 18px; }
    .ppv-ad img { width: 100%; height: 80px; border-radius: 10px; background: #fff; object-fit: contain; padding: 4px; }
    .ppv-ad-tag { display: inline-block; margin-bottom: 6px; padding: 4px 8px; border-radius: 999px; background: #00ae35; color: #fff; font-size: 10px; font-weight: 900; text-transform: uppercase; }
    .ppv-ad h3 { margin: 0 0 6px; color: #fff; font-size: 20px; font-weight: 900; }
    .ppv-ad p { margin: 0 0 12px; color: #dfe7dc; font-size: 13px; line-height: 1.45; }
    .ppv-ad-button, .ppv-sponsor-btn { display: inline-block; padding: 8px 16px; border-radius: 999px; background: #00ae35; color: #fff !important; font-size: 11px; font-weight: 900; text-transform: uppercase; text-decoration: none; }
    
    .ppv-apoio { margin-top: 38px; padding: 24px; border: 1px solid #e3eadf; border-radius: 18px; background: #f7f9f6; }
    .ppv-sponsor-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; margin-top: 16px; }
    .ppv-sponsor-card { display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-left: 4px solid #00ae35; border-radius: 12px; background: #ffffff; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .ppv-sponsor-card img { width: 100%; height: 60px; object-fit: contain; margin-bottom: 12px; }
    .ppv-sponsor-card h3 { margin: 0 0 6px; color: #21300c; font-size: 15px; font-weight: 800; }
    .ppv-sponsor-card p { margin: 0 0 12px; font-size: 12px; color: #4d5b43; line-height: 1.5; }

    .ppv-institucional { margin-top: 30px; padding: 20px; background: #101510; border-radius: 16px; color: #ffffff; text-align: center; border: 1px solid #00ae35; }
    .ppv-institucional h4 { font-family: "Anton", sans-serif; font-size: 22px; color: #00ae35; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .ppv-institucional p { font-size: 12px; color: #cbd5e1; line-height: 1.6; max-width: 650px; margin: 0 auto; }
    
    .view-pc { width: 100%; max-width: 1000px; }
    .view-tablet { width: 768px; margin: 0 auto; }
    .view-mobile { width: 375px; margin: 0 auto; }
  </style>
</head>
<body class="p-3 md:p-6">
  <div class="max-w-[1750px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- COLUNA DA ESQUERDA: FORMULÁRIO E ENTRADAS -->
    <div class="lg:col-span-5 bg-slate-900 p-5 rounded-2xl border border-slate-800 custom-scroll max-h-[95vh] overflow-y-auto space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-3.5 h-3.5 rounded-full bg-emerald-500 animate-pulse"></div>
          <h2 class="text-base font-black tracking-wider text-white">PV ONE <span class="text-xs text-emerald-400 font-normal">v3.0 Pista</span></h2>
        </div>
        <span class="text-[10px] font-mono bg-slate-800 text-emerald-400 px-2 py-1 rounded border border-emerald-500/20">Bloco 1 Oficial</span>
      </div>

      <div class="flex rounded-xl overflow-hidden p-1 bg-slate-950 border border-slate-800">
        <button id="tab-recebida" onclick="trocarOrigem('recebida')" class="w-1/2 py-2 text-xs font-bold rounded-lg transition bg-emerald-500 text-slate-950">1- Release Recebido</button>
        <button id="tab-propria" onclick="trocarOrigem('propria')" class="w-1/2 py-2 text-xs font-bold rounded-lg transition bg-slate-800 text-slate-400">2- Matéria Própria</button>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Título Principal (H1)</label>
          <input type="text" id="input-h1" oninput="processarMateria()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:border-emerald-500 outline-none font-bold" value="Rafael Kerkoff encara 7ª e 8ª etapas do Capixaba de Kart em busca da liderança">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Subtítulo / Linha Fina</label>
          <input type="text" id="input-subtitulo" oninput="processarMateria()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:border-emerald-500 outline-none" value="Piloto capixaba ocupa a 3ª colocação da sua categoria e quer somar pontos decisivos no Kartódromo da Serra.">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Categoria Oficial Wix</label>
            <select id="input-categoria" onchange="processarMateria()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-emerald-400 font-bold focus:border-emerald-500 outline-none">
              <option value="Kartismo">Kartismo</option>
              <option value="Copa do Brasil de Kart">Copa do Brasil de Kart</option>
              <option value="Automobilismo">Automobilismo</option>
              <option value="Sustentabilidade">Sustentabilidade</option>
              <option value="KIG RJ 2026">KIG RJ 2026</option>
              <option value="Copa São Paulo Light">Copa São Paulo Light</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Fotógrafo / Imagem</label>
            <input type="text" id="input-fotografo" oninput="processarMateria()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none" value="DarkSide Karts">
          </div>
        </div>

        <div class="p-3 bg-slate-950 border border-slate-800 rounded-xl space-y-2">
          <label class="block text-[11px] font-bold text-emerald-400 flex items-center gap-1.5">
            <i class="fa-solid fa-camera"></i> Fotos da Matéria (1ª Capa | 2ª Meio | 3ª Fim)
          </label>
          <input type="file" id="input-fotos" accept="image/*" multiple onchange="carregarFotos(event)" class="w-full text-[11px] text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-[11px] file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400 cursor-pointer">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Release / Corpo da Matéria</label>
          <textarea id="input-release" oninput="processarMateria()" rows="8" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:border-emerald-500 outline-none leading-relaxed">A programação do Campeonato Capixaba de Kart 2026 começa nesta sexta-feira (7), às 13h, com treinos livres. A tomada de tempo e as provas das 7ª e 8ª etapas, para todas as categorias, estão programadas para o sábado (8), no Kartódromo da Serra. As corridas e a disputa pelos pontos da rodada poderão ser acompanhadas ao vivo pelo público, no canal Kart Capixaba, no YouTube.

O piloto Rafael Kerkoff vem focado para manter a regularidade na temporada. Com treinos intensivos ao longo da semana, o competidor busca acertar a regulagem do chassis para extrair o máximo rendimento nas duas baterias decisivas.

A expectativa para o final de semana é de grid cheio e disputas acirradas curva a curva. A equipe trabalha no acerto final para garantir velocidade de reta e estabilidade nos trechos de mola do circuito da Serra.</textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Fonte / Assessoria</label>
            <input type="text" id="input-creditos" oninput="processarMateria()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none" value="Kako Marques / KMCom Assessoria">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">@ do Piloto (Instagram)</label>
            <input type="text" id="input-piloto-insta" oninput="processarMateria()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none" value="@rafaelkerkoff_107">
          </div>
        </div>
      </div>

      <button onclick="processarMateria()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl text-xs transition flex items-center justify-center gap-2 uppercase tracking-wider">
        <i class="fa-solid fa-rotate"></i> Gerar Matéria PV & Redes Sociais
      </button>
    </div>

    <!-- COLUNA DA DIREITA: PREVISÃO E EXPORTAÇÃO -->
    <div class="lg:col-span-7 space-y-5 custom-scroll max-h-[95vh] overflow-y-auto pr-1">
      
      <!-- CAPA GRÁFICA -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <h3 class="text-xs font-black text-emerald-400 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-image"></i> Capa Gráfica Proporcional (1080p)
        </h3>
        <div class="flex flex-col md:flex-row items-center gap-5 justify-center">
          <div class="relative shadow-2xl rounded-xl overflow-hidden border border-slate-700 bg-black">
            <canvas id="canvas-capa-oficial" width="270" height="480" class="block"></canvas>
          </div>
          <div class="space-y-2 w-full md:w-64">
            <a id="link-download-stories" download="capa-stories-pistaverde.png" class="w-full bg-emerald-500 text-slate-950 font-extrabold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer">
              <i class="fa-solid fa-download"></i> Download Stories (1080x1920)
            </a>
            <a id="link-download-feed" download="capa-feed-pistaverde.png" class="w-full bg-slate-800 text-emerald-400 border border-emerald-500/30 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 cursor-pointer">
              <i class="fa-solid fa-download"></i> Download Feed (1080x1350)
            </a>
          </div>
        </div>
      </div>

      <!-- SIMULADOR RESPONSIVO DA MATÉRIA -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <h3 class="text-xs font-black text-slate-300 uppercase tracking-wider">Simulador Responsivo da Matéria</h3>
          <div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button onclick="mudarView('pc')" class="px-2 py-1 text-[10px] font-bold rounded text-slate-300">PC</button>
            <button onclick="mudarView('tablet')" class="px-2 py-1 text-[10px] font-bold rounded bg-emerald-500 text-slate-950">Tablet</button>
            <button onclick="mudarView('mobile')" class="px-2 py-1 text-[10px] font-bold rounded text-slate-300">Celular</button>
          </div>
        </div>
        <div class="bg-slate-950 p-3 rounded-xl overflow-x-auto">
          <div id="leitor-container" class="view-tablet transition-all duration-300">
            <div id="leitor-materia-html"></div>
          </div>
        </div>
      </div>

      <!-- MÓDULO EXCLUSIVO DE REDES SOCIAIS & TIKTOK -->
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-4">
        <h3 class="text-xs font-black text-emerald-400 uppercase tracking-wider flex items-center gap-2 border-b border-slate-800 pb-2">
          <i class="fa-share-nodes fa-solid"></i> Central de Conteúdo para Redes Sociais
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- INSTAGRAM -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-pink-400 flex items-center gap-1">
                <i class="fa-brands fa-instagram"></i> Legenda Instagram:
              </span>
              <button onclick="copiarTexto('text-insta')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20 font-bold">
                <i class="fa-regular fa-copy"></i> Copiar
              </button>
            </div>
            <textarea id="text-insta" rows="6" readonly class="w-full bg-slate-950 text-slate-200 border border-slate-800 rounded-lg p-2 text-xs font-mono"></textarea>
          </div>

          <!-- TIKTOK LEGENDA -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold text-cyan-400 flex items-center gap-1">
                <i class="fa-brands fa-tiktok"></i> Legenda TikTok:
              </span>
              <button onclick="copiarTexto('text-tiktok')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20 font-bold">
                <i class="fa-regular fa-copy"></i> Copiar
              </button>
            </div>
            <textarea id="text-tiktok" rows="6" readonly class="w-full bg-slate-950 text-slate-200 border border-slate-800 rounded-lg p-2 text-xs font-mono"></textarea>
          </div>
        </div>

        <!-- TIKTOK ROTEIRO / TTS -->
        <div class="space-y-1.5 border-t border-slate-800 pt-3">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-bold text-emerald-400 flex items-center gap-1">
              <i class="fa-solid fa-microphone"></i> TikTok - Roteiro para Narração / Voz (TTS):
            </span>
            <button onclick="copiarTexto('text-tts')" class="text-[10px] bg-emerald-500 text-slate-950 px-2 py-0.5 rounded font-black hover:bg-emerald-400">
              <i class="fa-regular fa-copy"></i> Copiar Roteiro
            </button>
          </div>
          <textarea id="text-tts" rows="4" readonly class="w-full bg-slate-950 text-emerald-300 border border-emerald-500/30 rounded-lg p-2 text-xs font-mono leading-relaxed"></textarea>
        </div>
      </div>

    </div>
  </div>

  <script>
    const PUBLICIDADE_ROTACAO = [
      { nome: "Inovimpress", logo: "https://static.wixstatic.com/media/74713a_9f487564690a4668ac86e67489593635~mv2.jpg", url: "https://anovimpress.com.br/", desc: "Soluções em impressão para empresas, locação e suporte técnico.", btn: "Acessar Inovimpress" },
      { nome: "Casa das Cópias", logo: "https://static.wixstatic.com/media/74713a_4ea112cf6d5b4d029d41b74d003bbc0c~mv2.webp", url: "https://cdcj.shop/", desc: "Sua gráfica digital rápida e moderna para impressões corporativas.", btn: "Acessar Casa das Cópias" }
    ];

    const APOIADORES_FIXO = { nome: "Mega Kart", logo: "https://static.wixstatic.com/media/74713a_aa7f1a284bd943b4a719ad24efaff200~mv2.webp", url: "https://www.megakart.com.br/", desc: "Projeto de alta performance em chassis e componentes de kartismo.", btn: "Acessar Mega Kart" };
    
    const APOIADORES_ROTATIVO = [
      { nome: "Paralego Racing", logo: "https://static.wixstatic.com/media/74713a_c2a31e7ef0e948d48509688f39df0428~mv2.webp", url: "https://www.paralegoracing.com.br/", desc: "Variedade e qualidade em equipamentos para kartismo profissional.", btn: "Acessar Paralego" },
      { nome: "Krona Brasil", logo: "https://static.wixstatic.com/media/74713a_cefb94e3ec62450c9ef6ee52757e90e4~mv2.png", url: "https://www.instagram.com/krona_brasil/", desc: "Tubos e conexões de alta resistência e qualidade.", btn: "Acessar Krona" }
    ];

    let fotosCarregadas = [];

    function carregarFotos(e) {
      const files = Array.from(e.target.files);
      fotosCarregadas = [];
      let lidos = 0;
      files.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          fotosCarregadas.push({ src: evt.target.result, ordem: idx });
          lidos++;
          if (lidos === files.length) {
            fotosCarregadas.sort((a, b) => a.ordem - b.ordem);
            processarMateria();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function trocarOrigem(tipo) {
      document.getElementById('tab-recebida').className = tipo === 'recebida' ? 'w-1/2 py-2 text-xs font-bold rounded-lg transition bg-emerald-500 text-slate-950' : 'w-1/2 py-2 text-xs font-bold rounded-lg transition bg-slate-800 text-slate-400';
      document.getElementById('tab-propria').className = tipo === 'propria' ? 'w-1/2 py-2 text-xs font-bold rounded-lg transition bg-emerald-500 text-slate-950' : 'w-1/2 py-2 text-xs font-bold rounded-lg transition bg-slate-800 text-slate-400';
    }

    function mudarView(modo) {
      const el = document.getElementById('leitor-container');
      el.className = modo === 'pc' ? 'view-pc transition-all duration-300' : modo === 'tablet' ? 'view-tablet transition-all duration-300' : 'view-mobile transition-all duration-300';
    }

    function copiarTexto(id) {
      const field = document.getElementById(id);
      field.select();
      navigator.clipboard.writeText(field.value);
      alert('Texto copiado com sucesso!');
    }

    function processarMateria() {
      const h1 = document.getElementById('input-h1').value || 'TÍTULO DA MATÉRIA';
      const subtitulo = document.getElementById('input-subtitulo').value || '';
      const categoria = document.getElementById('input-categoria').value;
      const fotografo = document.getElementById('input-fotografo').value || 'Divulgação';
      const creditos = document.getElementById('input-creditos').value || 'Comunicação Oficial';
      const release = document.getElementById('input-release').value || '';
      const pilotoInsta = document.getElementById('input-piloto-insta').value || '';
      
      const fotoCapa = fotosCarregadas.length > 0 ? fotosCarregadas[0].src : 'https://static.wixstatic.com/media/74713a_3ba8ef02dac74c569b45af06d857ef29~mv2.jpeg';
      const adAtual = PUBLICIDADE_ROTACAO[0];
      const apoiaRotativo = APOIADORES_ROTATIVO[0];

      let htmlCorpo = `<div class="ppv-materia">
        <header class="ppv-hero" style="background-image: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%), url('${fotoCapa}');">
          <div class="ppv-hero-content">
            <span class="ppv-label">${categoria}</span>
            <h1 class="ppv-hero-title">${h1}</h1>
            <div class="ppv-underline"></div>
            <p class="ppv-subtitle">${subtitulo}</p>
          </div>
        </header>
        <main class="ppv-container">`;

      const paragrafos = release.split('\n').filter(p => p.trim() !== '');
      const meioIndice = Math.floor(paragrafos.length / 2);

      paragrafos.forEach((p, idx) => {
        htmlCorpo += `<p class="my-4 text-slate-800 text-base leading-relaxed">${p}</p>`;

        // FOTO 2: Inserida no meio da matéria (após o 1º parágrafo)
        if (fotosCarregadas.length > 1 && idx === 0) {
          htmlCorpo += `
            <figure class="my-6">
              <img src="${fotosCarregadas[1].src}" class="w-full rounded-xl max-h-[450px] object-cover border border-slate-200 shadow-md">
              <figcaption class="text-xs text-slate-500 mt-1.5 italic text-right">Foto: ${fotografo}</figcaption>
            </figure>`;
        }

        // BANNER DE PUBLICIDADE: Inserido exatamente no MEIO do texto
        if (idx === meioIndice) {
          htmlCorpo += `
            <aside class="ppv-ad">
              <a class="block" href="${adAtual.url}" target="_blank">
                <div class="ppv-ad-inner">
                  <img src="${adAtual.logo}" alt="${adAtual.nome}">
                  <div>
                    <span class="ppv-ad-tag">Publicidade</span>
                    <h3>${adAtual.nome}</h3>
                    <p>${adAtual.desc}</p>
                    <span class="ppv-ad-button">${adAtual.btn}</span>
                  </div>
                </div>
              </a>
            </aside>`;
        }

        // FOTO 3: Inserida no final do texto
        if (fotosCarregadas.length > 2 && idx === paragrafos.length - 1) {
          htmlCorpo += `
            <figure class="my-6">
              <img src="${fotosCarregadas[2].src}" class="w-full rounded-xl max-h-[450px] object-cover border border-slate-200 shadow-md">
              <figcaption class="text-xs text-slate-500 mt-1.5 italic text-right">Foto: ${fotografo}</figcaption>
            </figure>`;
        }
      });

      htmlCorpo += `

        </main></div>`;

      document.getElementById('leitor-materia-html').innerHTML = htmlCorpo;

    function renderizarCapaCanvas(titulo, cat, fotografo, srcCapa) {
      const canvas = document.getElementById('canvas-capa-oficial');
      const ctx = canvas.getContext('2d');
      const w = 270;
      const h = 480;

      ctx.fillStyle = '#0a0e17';
      ctx.fillRect(0, 0, w, h);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        const scale = Math.max(w / img.width, h / img.height);
        const x = (w / 2) - (img.width / 2) * scale;
        const y = (h / 2) - (img.height / 2) * scale;
        ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

        // Gradiente de leitura na parte inferior
        const grad = ctx.createLinearGradient(0, h * 0.25, 0, h);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.5, 'rgba(0,0,0,0.75)');
        grad.addColorStop(1, 'rgba(0,0,0,0.98)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);

        // Linha verde superior
        ctx.fillStyle = '#00ae35';
        ctx.fillRect(15, 12, w - 30, 4);

        // Categoria
        ctx.fillStyle = '#00ae35';
        ctx.fillRect(15, h - 195, 95, 18);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 9px sans-serif';
        ctx.fillText(cat.toUpperCase(), 20, h - 183);

        // Título Principal (H1)
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 14px "Anton", sans-serif';
        
        const palavras = titulo.toUpperCase().split(' ');
        let linha = '';
        let posY = h - 155;
        
        for (let n = 0; n < palavras.length; n++) {
          let test = linha + palavras[n] + ' ';
          if (ctx.measureText(test).width > (w - 30) && n > 0) {
            ctx.fillText(linha, 15, posY);
            linha = palavras[n] + ' ';
            posY += 17;
          } else {
            linha = test;
          }
        }
        ctx.fillText(linha, 15, posY);

        // Crédito do Fotógrafo
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.font = '600 8px sans-serif';
        ctx.fillText('FOTO: ' + fotografo.toUpperCase(), 15, h - 35);

        // Barra de Clientes/Apoiadores no Rodapé da Capa
        ctx.fillStyle = '#101510';
        ctx.fillRect(0, h - 25, w, 25);
        ctx.fillStyle = '#00ae35';
        ctx.font = '800 8px sans-serif';
        ctx.fillText('APOIO: MEGA KART | PARALEGO RACING', 15, h - 10);

        document.getElementById('link-download-stories').href = canvas.toDataURL('image/png');
        document.getElementById('link-download-feed').href = canvas.toDataURL('image/png');
      };
      img.src = srcCapa;
    }

    window.onload = function() { processarMateria(); };
  </script>
