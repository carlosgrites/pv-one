<script>
    let todasMaterias = [];

    // Busca automática dos releases processados assim que abre o site
    window.addEventListener('DOMContentLoaded', () => {
      carregarFilaDeReleases();
    });

    async function carregarFilaDeReleases() {
      const listaContainer = document.getElementById('lista-releases');
      listaContainer.innerHTML = '<p class="text-xs text-gray-400 p-2">Carregando matérias da fila...</p>';

      try {
        const response = await fetch('/api/releases');
        if (!response.ok) throw new Error("Erro na API");
        
        todasMaterias = await response.json();
        renderizarLista(todasMaterias);
        atualizarContadores(todasMaterias);
      } catch (err) {
        // Se a API não responder, mantém a matéria modelo como fallback
        listaContainer.innerHTML = `
          <div onclick="carregarMateriaModelo()" class="p-4 rounded-xl bg-[#142414] border border-[#00ae35] cursor-pointer transition">
            <span class="text-[10px] font-bold uppercase tracking-wider text-[#00ae35] bg-[#00ae35]/10 px-2 py-0.5 rounded border border-[#00ae35]/20">Pronto para Envio</span>
            <h4 class="font-bold text-sm text-white mt-2 line-clamp-2">Copa Brasil de Kart da CBA chega ao fim em Imperatriz</h4>
            <p class="text-xs text-gray-400 mt-1 line-clamp-2">Após duas semanas, 27ª edição terminou com grandes corridas...</p>
          </div>`;
      }
    }

    function renderizarLista(lista) {
      const container = document.getElementById('lista-releases');
      if (!lista || lista.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-500 p-2">Nenhuma matéria pendente nesta aba.</p>';
        return;
      }

      container.innerHTML = lista.map((mat, idx) => `
        <div onclick="carregarMateria(${idx})" class="p-4 rounded-xl bg-[#142414] border border-[#182e18] hover:border-[#00ae35] cursor-pointer transition mb-2">
          <span class="text-[10px] font-bold uppercase tracking-wider text-[#00ae35] bg-[#00ae35]/10 px-2 py-0.5 rounded border border-[#00ae35]/20">${mat.status || 'Pendente'}</span>
          <h4 class="font-bold text-sm text-white mt-2 line-clamp-2">${mat.titulo || mat.title}</h4>
          <p class="text-xs text-gray-400 mt-1 line-clamp-2">${mat.resumo || mat.content || ''}</p>
        </div>
      `).join('');
    }

    function carregarMateria(idx) {
      const mat = todasMaterias[idx];
      if (!mat) return;
      document.getElementById('title').value = mat.titulo || mat.title || '';
      document.getElementById('coverImage').value = mat.capa || mat.coverImage || '';
      if(document.getElementById('videoUrl')) document.getElementById('videoUrl').value = mat.video || mat.videoUrl || '';
      document.getElementById('richContent').value = mat.conteudo || mat.content || '';
      atualizarPreviews();
    }

    function carregarMateriaModelo() {
      document.getElementById('title').value = "Copa Brasil de Kart da CBA chega ao fim em Imperatriz com sete campeões e recorde igualado";
      document.getElementById('coverImage').value = "https://static.wixstatic.com/media/74713a_example.jpg";
      document.getElementById('richContent').value = "Após duas semanas, 27ª edição terminou com grandes corridas e a histórica 11ª conquista de André Nicastro...";
      atualizarPreviews();
    }

    function atualizarContadores(lista) {
      document.getElementById('count-fila').innerText = lista.length || 0;
    }

    function atualizarPreviews() {
      const url = document.getElementById('coverImage').value;
      const prevHero = document.getElementById('prev-hero');
      const prevInsta = document.getElementById('prev-insta');
      if (prevHero) prevHero.src = url;
      if (prevInsta) prevInsta.src = url;
    }

    function mudarAba(aba, el) {
      document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      const filtradas = todasMaterias.filter(m => (m.status || 'fila') === aba);
      renderizarLista(filtradas);
    }

    function filtrarFila() {
      const term = document.getElementById('campo-busca').value.toLowerCase();
      const filtradas = todasMaterias.filter(m => 
        (m.titulo || m.title || '').toLowerCase().includes(term) ||
        (m.conteudo || m.content || '').toLowerCase().includes(term)
      );
      renderizarLista(filtradas);
    }

    async function sendToWix() {
      const btn = document.getElementById('btn-enviar');
      btn.innerText = "Enviando ao Servidor...";
      btn.disabled = true;

      const payload = {
        title: document.getElementById('title').value,
        coverImage: document.getElementById('coverImage').value,
        videoUrl: document.getElementById('videoUrl') ? document.getElementById('videoUrl').value : '',
        content: document.getElementById('richContent').value
      };

      try {
        const response = await fetch('/api/wix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (response.ok && (data.success || data.id)) {
          alert("✅ Enviado para o Wix com sucesso!");
        } else {
          alert("❌ Erro no envio: " + (data.message || data.error || JSON.stringify(data)));
        }
      } catch (err) {
        alert("❌ Erro de conexão com o endpoint da Vercel (/api/wix).");
      } finally {
        btn.innerText = "Enviar para o Wix";
        btn.disabled = false;
      }
    }
  </script>
