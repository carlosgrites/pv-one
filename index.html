<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PV ONE 1.0 Pro — Portal Pista Verde</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background-color: #080d08; color: #f3f4f6; }
    .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-weight: 600; font-size: 13px; color: #9ca3af; border-radius: 10px; transition: all 0.2s; border: 1px solid transparent; }
    .sidebar-link:hover, .sidebar-link.active { background-color: #112211; color: #00ae35; border-color: #182e18; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; background-color: #040704; border: 1px solid #182e18; font-size: 11px; font-weight: 600; color: #9ca3af; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #00ae35; box-shadow: 0 0 6px #00ae35; }
    .tab-pill { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; background-color: #040704; border: 1px solid #182e18; color: #9ca3af; cursor: pointer; }
    .tab-pill.active { background-color: #142814; border-color: #00ae35; color: #ffffff; }
    .btn-action { background-color: #00ae35; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-action:hover { background-color: #00cd3e; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <header class="h-16 border-b border-[#182e18] bg-[#080d08] px-6 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-[#00ae35] flex items-center justify-center font-black text-black text-lg">PV</div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold tracking-wider text-white text-base">PV ONE</span>
          <span class="text-[10px] bg-[#00ae35]/20 text-[#00ae35] px-1.5 py-0.5 rounded border border-[#00ae35]/30 font-bold">v1.0 Pro</span>
        </div>
      </div>
    </div>
    <div class="hidden md:flex items-center gap-3">
      <div class="status-badge"><span class="status-dot"></span> Gmail Sync</div>
      <div class="status-badge"><span class="status-dot"></span> Gerador IA Ativo</div>
      <div class="status-badge"><span class="status-dot"></span> API Wix: <span class="text-[#00ae35] ml-1">Conectada</span></div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-60 border-r border-[#182e18] bg-[#080d08] p-4 flex flex-col justify-between shrink-0">
      <nav class="space-y-1.5">
        <a href="#" class="sidebar-link active">Redação & Matérias</a>
        <a href="#" class="sidebar-link">Fila de Publicação</a>
        <a href="#" class="sidebar-link">Ativos de Redes</a>
        <a href="#" class="sidebar-link">Conexão Wix</a>
      </nav>
      <div class="text-[11px] text-gray-500 border-t border-[#182e18] pt-3">
        <p class="font-bold text-gray-400">Portal Pista Verde</p>
      </div>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto bg-[#050805]">
      <div class="flex items-center gap-2 border-b border-[#182e18] pb-3 mb-6">
        <button class="tab-pill active">Fila Ativa</button>
        <button class="tab-pill">Em Processamento</button>
        <button class="tab-pill">Publicadas no Wix</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 bg-[#080d08] p-4 rounded-xl border border-[#182e18] space-y-3">
          <h3 class="font-bold text-xs uppercase tracking-wider text-gray-300">Entradas & Releases</h3>
          <input id="campo-busca" type="text" placeholder="Buscar piloto..." class="w-full bg-[#040704] border border-[#182e18] rounded-lg px-3 py-2 text-xs text-white">
          <div id="lista-releases" class="space-y-2">
            <div class="p-3 rounded-lg bg-[#040704] border border-[#00ae35]">
              <span class="text-[9px] font-bold uppercase text-[#00ae35]">Pronto para Wix</span>
              <h4 class="font-bold text-xs text-white mt-1">Copa Brasil de Kart CBA — Imperatriz</h4>
            </div>
          </div>
        </div>

        <div class="lg:col-span-8 bg-[#080d08] p-5 rounded-xl border border-[#182e18] space-y-5">
          <div class="flex items-center justify-between border-b border-[#182e18] pb-4">
            <h2 class="font-extrabold text-sm text-white uppercase tracking-wider">Central de Redação & IA</h2>
            <button id="btn-enviar" onclick="sendToWix()" class="btn-action px-5 py-2 rounded-lg text-xs">Publicar no Wix</button>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Título da Matéria</label>
              <input id="title" type="text" value="Copa Brasil de Kart CBA: Grandes disputas e novos campeões coroados em Imperatriz" class="w-full bg-[#040704] border border-[#182e18] rounded-lg p-2.5 text-xs text-white font-semibold">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Capa Hero Website (16:9)</label>
                <input id="coverImage" type="text" value="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?auto=format&fit=crop&w=1200&q=80" class="w-full bg-[#040704] border border-[#182e18] rounded-lg p-2.5 text-xs text-white font-mono">
              </div>
              <div>
                <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Vídeo MP4 Vertical (9:16)</label>
                <input id="videoUrl" type="text" value="https://assets.mixkit.co/videos/preview/mixkit-race-car-driving-on-a-track-41562-large.mp4" class="w-full bg-[#040704] border border-[#182e18] rounded-lg p-2.5 text-xs text-white font-mono">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-gray-300 uppercase mb-1">Conteúdo da Matéria</label>
              <textarea id="richContent" rows="5" class="w-full bg-[#040704] border border-[#182e18] rounded-lg p-3 text-xs text-gray-200">A 27ª edição da Copa Brasil de Kart foi encerrada no Kartódromo de Imperatriz (MA) com corridas de alto nível técnico. O Portal Pista Verde acompanhou de perto as finais das categorias Mirim, Cadete, Sênior e Graduados.</textarea>
            </div>
          </div>

          <div class="border-t border-[#182e18] pt-4 space-y-3">
            <h3 class="font-extrabold text-xs text-[#00ae35] uppercase tracking-wider">Ativos de Mídia para Redes</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label class="text-[11px] font-bold text-gray-300 uppercase block mb-1">Legenda Instagram</label>
                <textarea id="instaLegenda" rows="3" class="w-full bg-[#040704] border border-[#182e18] rounded-lg p-2 text-xs text-gray-300">🏁 FINAL HISTÓRICA NA COPA BRASIL DE KART! 🏆 Imperatriz (MA) foi palco de chegadas de tirar o fôlego. Acesse o Portal Pista Verde para ler a matéria completa!</textarea>
              </div>
              <div>
                <label class="text-[11px] font-bold text-gray-300 uppercase block mb-1">Roteiro TikTok / Reels</label>
                <textarea id="tiktokRoteiro" rows="3" class="w-full bg-[#040704] border border-[#182e18] rounded-lg p-2 text-xs text-gray-300">[00:00-00:03] A Copa Brasil de Kart 2026 conheceu seus grandes campeões! [00:03-00:07] Disputas no milésimo de segundo decidiram os títulos no Maranhão!</textarea>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function sendToWix() {
      const btn = document.getElementById('btn-enviar');
      btn.innerText = "Enviando ao Wix...";
      btn.disabled = true;

      const payload = {
        title: document.getElementById('title').value,
        coverImage: document.getElementById('coverImage').value,
        videoUrl: document.getElementById('videoUrl').value,
        content: document.getElementById('richContent').value,
        instaLegenda: document.getElementById('instaLegenda').value,
        tiktokRoteiro: document.getElementById('tiktokRoteiro').value
      };

      try {
        await fetch('/api/wix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        alert("✅ Matéria enviada para o Wix com sucesso!");
      } catch (err) {
        alert("⚠️ Dados salvos localmente no painel.");
      } finally {
        btn.innerText = "Publicar no Wix";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
