    function processarFotosMateria(textoBase, urlsFotos, creditoPadrao, htmlAd) {
      let paragrafos = textoBase.split('\n\n').filter(p => p.trim() !== '');
      const meio = Math.floor(paragrafos.length / 2);
      
      let listaFotos = [];
      if (urlsFotos && urlsFotos.trim() !== "") {
        listaFotos = urlsFotos.split('\n').map(u => u.trim()).filter(u => u !== "");
      }

      let fotosCorpo = [];
      let fotosCarrossel = [];

      if (listaFotos.length <= 4) {
        fotosCorpo = listaFotos;
      } else {
        fotosCorpo = listaFotos.slice(0, 4);
        fotosCarrossel = listaFotos.slice(4);
      }

      let resultadoHTML = "";
      let fotoIndex = 0;

      paragrafos.forEach((p, index) => {
        resultadoHTML += `<p>${p.trim()}</p>\n\n`;

        if (index === meio - 1) {
          resultadoHTML += `${htmlAd}\n\n`;
        }

        if ((index + 1) % 2 === 0 && fotoIndex < fotosCorpo.length) {
          resultadoHTML += `<figure class="ppv-inline-photo" style="margin:20px 0;">
            <img src="${fotosCorpo[fotoIndex]}" alt="Imagem da matéria" style="width:100%; border-radius:8px;">
            <figcaption class="ppv-photo-caption" style="font-size:11px; color:#6b7280; font-style:italic; margin-top:6px; text-align:right;">${creditoPadrao}</figcaption>
          </figure>\n\n`;
          fotoIndex++;
        }
      });

      while (fotoIndex < fotosCorpo.length) {
        resultadoHTML += `<figure class="ppv-inline-photo" style="margin:20px 0;">
          <img src="${fotosCorpo[fotoIndex]}" alt="Imagem da matéria" style="width:100%; border-radius:8px;">
          <figcaption class="ppv-photo-caption" style="font-size:11px; color:#6b7280; font-style:italic; margin-top:6px; text-align:right;">${creditoPadrao}</figcaption>
        </figure>\n\n`;
        fotoIndex++;
      }

      if (fotosCarrossel.length > 0) {
        let htmlCarrossel = `<section class="ppv-carousel-section" style="margin-top:32px; border-top:2px solid #00ae35; padding-top:16px;">
          <h3 style="color:#21300c; font-weight:800; text-transform:uppercase; font-size:16px; margin-bottom:12px;">Galeria de Fotos da Cobertura</h3>
          <div class="ppv-carousel-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:12px;">`;

        fotosCarrossel.forEach(url => {
          htmlCarrossel += `<div class="ppv-carousel-item">
            <img src="${url}" alt="Galeria Pista Verde" style="width:100%; height:140px; object-fit:cover; border-radius:6px;">
          </div>`;
        });

        htmlCarrossel += `</div>
          <figcaption class="ppv-photo-caption" style="font-size:11px; color:#6b7280; font-style:italic; margin-top:8px; text-align:right;">${creditoPadrao}</figcaption>
        </section>\n\n`;

        resultadoHTML += htmlCarrossel;
      }

      return resultadoHTML;
    }

      const htmlAssinaturaJornalista = `<div class="ppv-editorial-credit"><p style="margin:0; font-weight:600; color:#21300c;">Jornalista Responsável: <strong>José Carlos Grites</strong> <span style="color:#00ae35; font-weight:700; margin-left:6px;">| DRT 0007501/SC</span></p><p style="margin:4px 0 0; font-size:11px; color:#6b7280;">Portal Pista Verde — A primeira startup de jornalismo especializado e projetos ESG/ODS para o kartismo e automobilismo brasileiro.</p></div>`;
      const htmlFooterSponsors = `<section class="ppv-sponsors-section"><h2>Empresas que Apoiam o Esporte</h2><div class="ppv-sponsor-grid"><article class="ppv-sponsor-card"><a href="https://www.megakart.com.br/" target="_blank"><img src="https://static.wixstatic.com/media/74713a_aa7f1a284bd943b4a719ad24efaff200~mv2.webp" alt="Mega Kart"></a><h3>Mega Kart</h3><p>Fabricante latino-americana de karts, peças e acessórios.</p></article><article class="ppv-sponsor-card"><a href="${clienteSecundario.url}" target="_blank"><img src="${clienteSecundario.img}" alt="${clienteSecundario.nome}"></a><h3>${clienteSecundario.nome}</h3><p>${clienteSecundario.desc}</p></article></div></section>`;

      let conteudoCorpo = processarFotosMateria(rascunho, fotosExtras, creditoFoto, htmlAd);

      if (tipoLinha === 'propria') {
        conteudoCorpo = `<p>A cobertura do <strong>Portal Pista Verde</strong> traz os detalhes da categoria <a href="https://www.pistaverde.com.br/blog/categories/${slugCat}"><strong>${categoria}</strong></a>.</p>\n\n` + conteudoCorpo;
      }

      const htmlFinal = `${cssOficial}\n<article class="ppv-materia">\n${htmlHero}\n<div class="ppv-container">\n${conteudoCorpo}\n${htmlAssinaturaJornalista}\n${htmlFooterSponsors}\n</div>\n</article>`;

      atualizarCamposInterface(titulo, subtitulo, categoria, htmlFinal, rascunho);
      alert('SUCESSO: Matéria processada no painel local. Revise o resultado antes de enviar para o Wix.');
    }

    async function dispararParaWix() {
      const htmlFinal = document.getElementById('resultado').value;
      const titulo = document.getElementById('titulo').value;
      const imgCapa = document.getElementById('img-capa').value;
      const btn = document.getElementById('btn-wix');

      if (!htmlFinal) {
        alert('Erro: Processe a matéria primeiro clicando no botão verde.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = 'Disparando para o Wix...';

      const tagsArray = document.getElementById('seo-tags').value.split(',').map(t => t.trim());
      const payloadWix = {
        draftPost: {
          title: titulo,
          richContent: htmlFinal,
          coverMedia: { image: { url: imgCapa } },
          hashtags: tagsArray,
          seoData: {
            tags: [
              { type: "title", content: `${titulo} | Portal Pista Verde` },
              { type: "meta", props: { name: "description", content: document.getElementById('seo-desc').value } }
            ]
          }
        }
      };

      try {
        const response = await fetch('https://www.wixapis.com/blog/v3/draft-posts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'wix-site-id': WIX_SITE_ID,
            'Authorization': WIX_API_KEY
          },
          body: JSON.stringify(payloadWix)
        });

        if (response.ok) {
          alert('SUCESSO: Matéria enviada diretamente para a pasta de RASCUNHOS do Wix Studio.');
          avancarRotizio();
        } else {
          alert('Aviso: Erro na resposta da API Wix. Verifique as permissões da chave.');
        }
      } catch (err) {
        alert('Erro na conexão com a API do Wix.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 Enviar para Rascunhos do Wix';
      }
    }

    function avancarRotizio() {
      const selectRot = document.getElementById('apoiador-rotativo');
      selectRot.selectedIndex = (selectRot.selectedIndex < selectRot.options.length - 1) ? selectRot.selectedIndex + 1 : 0;
    }

    function atualizarCamposInterface(titulo, subtitulo, categoria, html, textoPuro) {
      const slug = titulo.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-');
      
      document.getElementById('resultado').value = html;
      document.getElementById('preview').innerHTML = html;
      
      document.getElementById('seo-kw').value = `${categoria.toLowerCase()} ${titulo.split(' ')[0].toLowerCase()}`;
      document.getElementById('seo-title').value = `${titulo} | Portal Pista Verde`;
      document.getElementById('seo-desc').value = `Confira a cobertura sobre ${titulo} na categoria ${categoria}. Leia no Portal Pista Verde.`;
      document.getElementById('seo-slug').value = slug;
      
      const schemaLocal = { 
        "@context": "https://schema.org", 
        "@type": "NewsArticle", 
        "headline": titulo, 
        "articleSection": categoria, 
        "author": { "@type": "Person", "name": "José Carlos Grites", "jobTitle": "Jornalista (DRT 0007501/SC)" },
        "publisher": { "@type": "Organization", "name": "Portal Pista Verde" } 
      };
      document.getElementById('seo-schema').value = JSON.stringify(schemaLocal, null, 2);
      
      const arrayTags = [categoria.toLowerCase(), ...baseTagsGerais].slice(0, 28);
      document.getElementById('seo-tags').value = arrayTags.join(", ");

      const hashtagsSocial = arrayTags.slice(0, 10).map(t => `#${t.replace(/\s+/g, '')}`).join(' ');

      document.getElementById('social-ig').value = `${titulo.toUpperCase()}\n\n${subtitulo}\n\n${textoPuro.substring(0, 1200)}...\n\nMatéria completa e cobertura detalhada no link da bio do Portal Pista Verde.\n\nJornalista Responsável: José Carlos Grites (DRT 0007501/SC)\n\n${hashtagsSocial}`;
      document.getElementById('social-stories').value = `DESTAQUE NA CATEGORIA ${categoria.toUpperCase()}\n\n${titulo}\n\nAcesse o link na bio para ler a matéria completa no Portal Pista Verde.`;
      document.getElementById('social-tiktok').value = `LEGENDA TIKTOK:\n${titulo} - Cobertura da categoria ${categoria}.\n\nROTEIRO LOCAÇÃO (30 SEG):\n1. Abertura: ${titulo}.\n2. Fato Principal: ${subtitulo}.\n3. Fechamento: Confira a matéria completa no Portal Pista Verde.\n\n${hashtagsSocial}`;
      document.getElementById('social-fb').value = `PORTAL PISTA VERDE | COBERTURA OFICIAL\n\n${titulo}\n\n${subtitulo}\n\nLeia a matéria na íntegra no portal oficial: https://www.pistaverde.com.br/blog/${slug}`;
    }
  </script>
