<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PV One - Portal Pista Verde</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen">
  <nav class="bg-black p-4 border-b border-green-500 flex justify-between items-center">
    <h1 class="text-xl font-bold text-green-400">PV ONE <span class="text-xs text-gray-400">v1.1</span></h1>
    <span class="text-sm bg-green-900 text-green-300 px-3 py-1 rounded-full">Sistema Ativo</span>
  </nav>

  <main class="p-6 max-w-5xl mx-auto space-y-6">
    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 shadow-xl">
      <h2 class="text-2xl font-bold mb-4 border-b border-gray-700 pb-2 text-green-400">Módulo 1: Redação & Editorial</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Coluna de Entrada / Edição -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Título da Matéria (SEO Nativo)</label>
            <input id="titulo" type="text" placeholder="Ex: GP de Kart - Etapa Final" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white focus:outline-none focus:border-green-500">
          </div>

          <div>
            <label class="block text-sm font-medium mb-1">Tópicos / Rascunho Bruto</label>
            <textarea id="rascunho" rows="8" placeholder="Digite os pontos principais da matéria aqui..." class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-white focus:outline-none focus:border-green-500"></textarea>
          </div>

          <div class="flex gap-2">
            <button onclick="gerarFormatado()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 rounded transition">
              ⚡ Gerar Formatação Wix
            </button>
          </div>
        </div>

        <!-- Coluna de Saída (HTML / Visualização) -->
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Resultado (Pronto para o Wix)</label>
            <textarea id="resultado" rows="11" readonly class="w-full p-2 bg-black border border-gray-700 rounded text-green-300 font-mono text-sm focus:outline-none" placeholder="O texto formatado aparecerá aqui..."></textarea>
          </div>

          <button onclick="copiarTexto()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded transition">
            📋 Copiar Conteúdo
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function gerarFormatado() {
      const titulo = document.getElementById('titulo').value || 'Sem Título';
      const rascunho = document.getElementById('rascunho').value || 'Sem conteúdo inserido.';
      
      const paragrafos = rascunho.split('\n').filter(p => p.trim() !== '').map(p => `<p>${p}</p>`).join('\n');
      
      const htmlFinal = `<h1>${titulo}</h1>\n\n${paragrafos}\n\n<p><strong>Portal Pista Verde - Cobertura Oficial</strong></p>`;
      
      document.getElementById('resultado').value = htmlFinal;
    }

    function copiarTexto() {
      const resultado = document.getElementById('resultado');
      resultado.select();
      document.execCommand('copy');
      alert('Conteúdo copiado para a área de transferência!');
    }
  </script>
</body>
</html>
