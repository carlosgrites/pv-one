    function desenharCapaOficialCanvas(titulo, subtitulo, categoria, imgCapaUrl, creditoFoto, clienteApoiador) {
      const canvas = document.getElementById('capa-canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = "Anonymous";
      img.src = imgCapaUrl || 'https://static.wixstatic.com/media/74713a_3ba8ef02dac74c569b45af06d857ef29~mv2.jpeg';

      img.onload = () => {
        // 1. Desenha Imagem de Fundo em proporção 1080x1350
        ctx.drawImage(img, 0, 0, 1080, 1350);

        // 2. Degradê Escuro Inferior para Leitura Perfeita do Título
        const grad = ctx.createLinearGradient(0, 400, 0, 1350);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(0.4, 'rgba(0,0,0,0.75)');
        grad.addColorStop(1, 'rgba(0,0,0,0.95)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1350);

        // 3. Linha Verde Superior Oficial
        ctx.fillStyle = '#00ae35';
        ctx.fillRect(60, 60, 960, 12);

        // 4. Tag da Categoria (Pílula Verde)
        ctx.font = '800 28px Arial, sans-serif';
        const textCat = categoria.toUpperCase();
        const catWidth = ctx.measureText(textCat).width;
        
        ctx.fillStyle = '#00ae35';
        ctx.beginPath();
        ctx.roundRect(60, 720, catWidth + 36, 52, 26);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.fillText(textCat, 78, 756);

        // 5. Título Principal em Caixa Alta
        ctx.font = '900 52px Arial, sans-serif';
        ctx.fillStyle = '#ffffff';
        
        let words = titulo.toUpperCase().split(' ');
        let line = '';
        let y = 830;
        
        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let metrics = ctx.measureText(testLine);
          if (metrics.width > 940 && n > 0) {
            ctx.fillText(line, 60, y);
            line = words[n] + ' ';
            y += 58;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, 60, y);

        // 6. Sublinhado Verde da Matéria
        y += 24;
        ctx.fillStyle = '#00ae35';
        ctx.fillRect(60, y, 140, 8);

        // 7. Subtítulo / Linha de Sutiã
        y += 44;
        ctx.font = '500 26px Arial, sans-serif';
        ctx.fillStyle = '#e2e8f0';
        
        let subWords = subtitulo.split(' ');
        let subLine = '';
        
        for (let n = 0; n < subWords.length; n++) {
          let testLine = subLine + subWords[n] + ' ';
          if (ctx.measureText(testLine).width > 940 && n > 0) {
            ctx.fillText(subLine, 60, y);
            subLine = subWords[n] + ' ';
            y += 34;
          } else {
            subLine = testLine;
          }
        }
        ctx.fillText(subLine, 60, y);

        // 8. Rodapé Oficial: Faixa Preta de Patrocinadores
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 1230, 1080, 120);

        ctx.font = '800 16px Arial, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('ESSAS EMPRESAS APOIAM O ESPORTE', 60, 1256);

        // Molduras dos Patrocinadores (Mega Kart + Rotativo)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(60, 1268, 140, 52);
        ctx.fillRect(212, 1268, 140, 52);

        ctx.font = '900 14px Arial, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText('MEGA KART', 82, 1300);
        ctx.fillText(clienteApoiador.nome.substring(0, 12).toUpperCase(), 222, 1300);

        // Crédito da Foto no Canto Inferior Direito
        ctx.font = 'italic 16px Arial, sans-serif';
        ctx.fillStyle = '#94a3b8';
        const txtCred = (creditoFoto || 'FOTO: DIVULGAÇÃO').toUpperCase();
        const credWidth = ctx.measureText(txtCred).width;
        ctx.fillText(txtCred, 1020 - credWidth, 1300);

        // Prepara Botão de Download
        const downloadBtn = document.getElementById('btn-download-capa');
        downloadBtn.href = canvas.toDataURL('image/png');
      };
    }

    function processarMateriaEGerarCapa() {
      const tipoLinha = document.getElementById('tipo-linha').value;

      const categoria = document.getElementById('categoria').value;

      const chaveRotativo = document.getElementById('apoiador-rotativo').value;

      if (!titulo || !rascunho) return alert('Preencha o Título e o Texto da Matéria.');

      const clienteSecundario = clientesRodizio[chaveRotativo];
      const slugCat = categoria.toLowerCase().replace(/[^a-z0-9]/g, '-');

      // 1. Renderiza a Capa Oficial Unificada no Canvas
      desenharCapaOficialCanvas(titulo, subtitulo, categoria, imgCapa, creditoFoto, clienteSecundario);

      // 2. Monta o HTML Limpo para a Matéria
      const cssOficial = `<style>
  .ppv-materia { font-family: "Poppins", "Inter", Arial, sans-serif; color: #21300c; background: #ffffff; line-height: 1.75; }
  .ppv-container { max-width: 840px; margin: 0 auto; padding: 24px 16px 48px; }
</style>`;

      let paragrafos = rascunho.split('\n\n').filter(p => p.trim() !== '');
      let conteudoCorpo = "";

      paragrafos.forEach(p => {
        let txt = p.trim();
        if (txt.startsWith('"') || txt.startsWith('“')) {
          conteudoCorpo += `<blockquote style="border-left: 4px solid #00ae35; padding: 12px 18px; margin: 24px 0; background: #f8fafc; font-style: italic; color: #1e293b; font-size: 15px;">${txt}</blockquote>\n\n`;
        } else {
          conteudoCorpo += `<p style="margin-bottom: 18px; color: #334155; font-size: 16px; line-height: 1.8;">${txt}</p>\n\n`;
        }
      });

      const htmlAssinatura = `<div style="border-top:1px solid #e2e8f0; padding-top:14px; margin-top:28px; font-size:13px; color:#374151;"><p style="margin:0; font-weight:600; color:#21300c;">Jornalista Responsável: <strong>José Carlos Grites</strong> <span style="color:#00ae35; font-weight:700; margin-left:6px;">| DRT 0007501/SC</span></p><p style="margin:4px 0 0; font-size:11px; color:#6b7280;">Portal Pista Verde — A primeira startup de jornalismo especializado e projetos ESG/ODS para o kartismo e automobilismo brasileiro.</p></div>`;

      const htmlFinal = `${cssOficial}\n<article class="ppv-materia">\n<div class="ppv-container">\n${conteudoCorpo}\n${htmlAssinatura}\n</div>\n</article>`;

      atualizarCamposInterface(titulo, subtitulo, categoria, htmlFinal, rascunho);
      alert('SUCESSO: Capa Oficial Renderizada e Matéria Processada.');
    }

          seoData: {
            tags: [
              { type: "title", content: `${titulo} | Portal Pista Verde` },
              { type: "meta", props: { name: "description", content: document.getElementById('seo-desc').value } }
            ]
          }
        }
      };

      try {
        const response = await fetch('https://www.wixapis.com/blog/v3/draft-posts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'wix-site-id': WIX_SITE_ID,
            'Authorization': WIX_API_KEY
          },
          body: JSON.stringify(payloadWix)
        });

        if (response.ok) {
          alert('SUCESSO: Matéria enviada para os RASCUNHOS do Wix Studio.');
          avancarRotizio();
        } else {
          alert('Aviso: Verifique a permissão do Wix.');
        }
      } catch (err) {
        alert('Erro na conexão com a API do Wix.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 Enviar para Rascunhos do Wix';
      }
    }

    function avancarRotizio() {
      const selectRot = document.getElementById('apoiador-rotativo');
      selectRot.selectedIndex = (selectRot.selectedIndex < selectRot.options.length - 1) ? selectRot.selectedIndex + 1 : 0;
    }

    function atualizarCamposInterface(titulo, subtitulo, categoria, html, textoPuro) {
      const slug = titulo.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/[^\w\s-]/g, '').replace(/[\s_-]+/g, '-');
      
      document.getElementById('resultado').value = html;
      document.getElementById('preview').innerHTML = html;
      
      document.getElementById('seo-kw').value = `${categoria.toLowerCase()} ${titulo.split(' ')[0].toLowerCase()}`;
      document.getElementById('seo-title').value = `${titulo} | Portal Pista Verde`;
      document.getElementById('seo-desc').value = `Confira a cobertura sobre ${titulo} na categoria ${categoria}. Leia no Portal Pista Verde.`;
      document.getElementById('seo-slug').value = slug;
      
      const schemaLocal = { 
        "@context": "https://schema.org", 
        "@type": "NewsArticle", 
        "headline": titulo, 
        "articleSection": categoria, 
        "author": { "@type": "Person", "name": "José Carlos Grites", "jobTitle": "Jornalista (DRT 0007501/SC)" },
        "publisher": { "@type": "Organization", "name": "Portal Pista Verde" } 
      };
      document.getElementById('seo-schema').value = JSON.stringify(schemaLocal, null, 2);
      
      const arrayTags = [categoria.toLowerCase(), ...baseTagsGerais].slice(0, 28);
      document.getElementById('seo-tags').value = arrayTags.join(", ");

      const hashtagsSocial = arrayTags.slice(0, 10).map(t => `#${t.replace(/\s+/g, '')}`).join(' ');

      document.getElementById('social-ig').value = `${titulo.toUpperCase()}\n\n${subtitulo}\n\n${textoPuro.substring(0, 1200)}...\n\nMatéria completa e cobertura detalhada no link da bio do Portal Pista Verde.\n\nJornalista Responsável: José Carlos Grites (DRT 0007501/SC)\n\n${hashtagsSocial}`;
      document.getElementById('social-stories').value = `DESTAQUE NA CATEGORIA ${categoria.toUpperCase()}\n\n${titulo}\n\nAcesse o link na bio para ler a matéria completa no Portal Pista Verde.`;
      document.getElementById('social-tiktok').value = `LEGENDA TIKTOK:\n${titulo} - Cobertura da categoria ${categoria}.\n\nROTEIRO LOCAÇÃO (30 SEG):\n1. Abertura: ${titulo}.\n2. Fato Principal: ${subtitulo}.\n3. Fechamento: Confira a matéria completa no Portal Pista Verde.\n\n${hashtagsSocial}`;
    }
  </script>
